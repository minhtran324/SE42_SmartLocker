; SLMS Locker Controller firmware — UC-I01–I08
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8       ; MQTT client (UC-I01)
    bblanchon/ArduinoJson @ ^7.1.0      ; command/event payload (de)serialization
