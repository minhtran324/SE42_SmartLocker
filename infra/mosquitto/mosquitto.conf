# Local development broker only — plaintext listener on 1883.
# Do NOT use this config as-is in production: add TLS certs + auth for the 8883 listener
# to match UC-I01 (WiFi/MQTT broker connectivity with TLS).

listener 1883
allow_anonymous true

# listener 8883
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# allow_anonymous false
# password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
log_dest stdout
